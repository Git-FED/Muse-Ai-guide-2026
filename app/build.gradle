plugins {
    id 'com.android.application'
    id 'maven-publish'
}

android {
    namespace 'com.fedpromptly.museaudit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fedpromptly.museaudit'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def githubRepository = System.getenv('GITHUB_REPOSITORY') ?: 'owner/repository'

publishing {
    publications {
        github(MavenPublication) {
            groupId = 'com.fedpromptly'
            artifactId = 'muse-audit'
            version = findProperty('packageVersion') ?: android.defaultConfig.versionName

            artifact("$buildDir/outputs/apk/debug/app-debug.apk") {
                extension = 'apk'
            }

            pom {
                name = 'FedPromptly Muse Audit'
                description = 'Offline Android app for the FedPromptly Muse usage-audit companion.'
                url = 'https://github.com/' + githubRepository
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/$githubRepository")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
